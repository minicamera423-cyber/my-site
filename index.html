<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست دسترسی</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding-top: 50px; }
        .btn { background-color: green; color: white; padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; }
    </style>
</head>
<body>
    <h2>تست سیستم لوکیشن</h2>
    <p>اگر دکمه زیر کار کند، پیام درخواست دسترسی ظاهر می‌شود.</p>
    <button class="btn" onclick="getLocation()">کلیک کنید تا دسترسی گرفته شود</button>

    <script>
    function getLocation() {
        alert("دکمه کار می‌کند! حالا مرورگر درخواست لوکیشن می‌دهد...");
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { alert("لوکیشن دریافت شد: " + pos.coords.latitude); }, 
                (err) => { alert("خطا در دریافت لوکیشن: " + err.message); }, 
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            alert("مرورگر شما از Geolocation پشتیبانی نمی‌کند.");
        }
    }
    </script>
</body>
</html>
